services:
  mongo1:
    image: mongo:8.0
    container_name: mongo1
    entrypoint: ["bash", "-c", "cp /tmp/kf-src /etc/mongo-keyfile && chmod 400 /etc/mongo-keyfile && chown mongodb:mongodb /etc/mongo-keyfile && exec docker-entrypoint.sh mongod --config /etc/mongod.conf"]
    volumes:
      - mongo1-data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
      - ./mongo-keyfile:/tmp/kf-src:ro
    networks: [red-mongo]
  mongo2:
    image: mongo:8.0
    container_name: mongo2
    entrypoint: ["bash", "-c", "cp /tmp/kf-src /etc/mongo-keyfile && chmod 400 /etc/mongo-keyfile && chown mongodb:mongodb /etc/mongo-keyfile && exec docker-entrypoint.sh mongod --config /etc/mongod.conf"]
    volumes:
      - mongo2-data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
      - ./mongo-keyfile:/tmp/kf-src:ro
    networks: [red-mongo]
  mongo3:
    image: mongo:8.0
    container_name: mongo3
    entrypoint: ["bash", "-c", "cp /tmp/kf-src /etc/mongo-keyfile && chmod 400 /etc/mongo-keyfile && chown mongodb:mongodb /etc/mongo-keyfile && exec docker-entrypoint.sh mongod --config /etc/mongod.conf"]
    volumes:
      - mongo3-data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
      - ./mongo-keyfile:/tmp/kf-src:ro
    networks: [red-mongo]
volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
networks:
  red-mongo:
